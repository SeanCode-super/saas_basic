name: Feature Request / Enhancement
description: Propose a new platform capability, storage/AI adapter, or standardization improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Suggestions aligned with [ROADMAP.md](../../docs/ROADMAP.md) are especially welcome!
  - type: textarea
    id: summary
    attributes:
      label: Problem & Proposed Solution
      description: What problem does this solve, and how should it fit into the modular-monolith boundaries?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives & Constraints
      description: Mention any multi-tenant isolation, RBAC, or backwards-compatibility considerations.
