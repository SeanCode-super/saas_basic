spring:
  application:
    name: saas-basics-server
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  profiles:
    default: db

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  openapi:
    title: "Antigravity Enterprise SaaS 开放接口文档"
    description: "Antigravity SaaS 工业级高韧性多租户平台 OpenAPI 规范"
    version: "v1.0.0"
    group:
      default:
        group-name: "平台全部接口"
        api-rule: package
        api-rule-resources:
          - com.saasbasics.platform.modules

saas-basics:
  security:
    cors-allowed-origins:
      - http://localhost:9527
      - http://*.localhost:9527
      - http://127.0.0.1:9527
      - http://localhost:5173
      - http://*.localhost:5173
      - http://127.0.0.1:5173
      - http://[::1]:5173
      - http://localhost:8080
      - http://127.0.0.1:8080
    auth:
      session-ttl-minutes: 480
    vault:
      enabled: true
      active-key-version: v1
      master-key: ${SAAS_VAULT_MASTER_KEY:tianshu-saas-basics-local-vault-master-key-change-in-prod}
  rate-limit:
    enabled: true
    tenant-rpm: 1200
    ai-tenant-rpm: 60
    ip-rpm: 600
    window-seconds: 60
  telemetry:
    enabled: true
    service-name: saas-basics-server
    otlp-enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
    max-recent-traces: 100

flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: full
  process:
    definition-cache-limit: 100

