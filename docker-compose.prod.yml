services:
  saas-mysql:
    image: mysql:8.3.0
    container_name: saas-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set an independent MySQL administration password}
      MYSQL_DATABASE: ${DB_NAME:-saas_basics}
      MYSQL_USER: ${DB_USERNAME:-saas_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
    ports:
      - "127.0.0.1:${SAAS_MYSQL_PORT:-3306}:3306"
    volumes:
      - saas-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - saas-network

  saas-redis:
    image: redis:7.2-alpine
    container_name: saas-redis
    restart: always
    ports:
      - "127.0.0.1:${SAAS_REDIS_PORT:-6379}:6379"
    volumes:
      - saas-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - saas-network

  saas-backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: saas-backend
    restart: always
    depends_on:
      saas-mysql:
        condition: service_healthy
      saas-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: "prod,db"
      SAAS_INDUSTRY_GATEWAY: ${SAAS_INDUSTRY_GATEWAY:-http://industry-gateway:8080}
      DB_HOST: saas-mysql
      DB_PORT: 3306
      DB_NAME: saas_basics
      DB_USERNAME: ${DB_USERNAME:-saas_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      REDIS_HOST: saas-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SAAS_VAULT_MASTER_KEY: ${SAAS_VAULT_MASTER_KEY:?SAAS_VAULT_MASTER_KEY environment variable is required}
      SAAS_PAY_WEBHOOK_SECRET: ${SAAS_PAY_WEBHOOK_SECRET:-}
      SAAS_CORS_ORIGIN: ${SAAS_CORS_ORIGIN:-https://console.tianshu.example}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "${SAAS_BACKEND_PORT:-8080}:8080"
    networks:
      - saas-network

  saas-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: saas-frontend
    restart: always
    depends_on:
      - saas-backend
    ports:
      - "${SAAS_FRONTEND_PORT:-80}:80"
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  saas-mysql-data:
  saas-redis-data:
