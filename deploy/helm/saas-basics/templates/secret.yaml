apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saas-basics.fullname" . }}-secrets
  labels:
    {{- include "saas-basics.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  SAAS_VAULT_MASTER_KEY: {{ .Values.secrets.vaultMasterKey | quote }}
  SAAS_PAY_WEBHOOK_SECRET: {{ .Values.secrets.payWebhookSecret | quote }}
