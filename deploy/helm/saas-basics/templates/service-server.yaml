apiVersion: v1
kind: Service
metadata:
  name: {{ include "saas-basics.fullname" . }}-server
  labels:
    {{- include "saas-basics.labels" . | nindent 4 }}
    component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.serverPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: server
