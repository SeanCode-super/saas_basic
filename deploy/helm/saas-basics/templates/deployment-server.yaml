apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "saas-basics.fullname" . }}-server
  labels:
    {{- include "saas-basics.labels" . | nindent 4 }}
    component: server
spec:
  replicas: {{ .Values.replicaCount.server }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: server
  template:
    metadata:
      labels:
        {{- include "saas-basics.labels" . | nindent 8 }}
        component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: "{{ .Values.image.server.repository }}:{{ .Values.image.server.tag }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfilesActive | quote }}
            - name: DB_HOST
              value: {{ .Values.env.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.env.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.env.dbName | quote }}
            - name: DB_USERNAME
              value: {{ .Values.env.dbUsername | quote }}
            - name: REDIS_HOST
              value: {{ .Values.env.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.env.redisPort | quote }}
            - name: SAAS_CORS_ORIGIN
              value: {{ .Values.env.corsOrigin | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "saas-basics.fullname" . }}-secrets
                  key: DB_PASSWORD
            - name: SAAS_VAULT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "saas-basics.fullname" . }}-secrets
                  key: SAAS_VAULT_MASTER_KEY
            - name: SAAS_PAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "saas-basics.fullname" . }}-secrets
                  key: SAAS_PAY_WEBHOOK_SECRET
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
