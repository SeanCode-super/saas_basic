global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "tianshu-saas-server"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["server:8080"]
        labels:
          service: "saas-basics-server"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
