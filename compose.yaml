services:
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_DATABASE: saas_basics
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${SAAS_MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - saas-mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    ports:
      - "${SAAS_REDIS_PORT:-6379}:6379"
    volumes:
      - saas-redis-data:/data

volumes:
  saas-mysql-data:
  saas-redis-data:
